# ==============================================================================
# LLM-As-A-Judge Quality Control Pipeline — Central Configuration
# ==============================================================================

pipeline:
  run_evaluation: true                     # Phase 1: Batch LLM-as-a-Judge evaluation
  run_calibration: true                    # Phase 2: Calibration Gate vs human baseline
  evaluator_type: "custom_judge"           # Options: "custom_judge" or "ragas"

models:
  generator_model: "openai/gpt-3.5-turbo"

  # === JUDGE MODEL (used by all phases) ===
  # Prefix determines the provider:
  #   "gemini/"  → Google AI Studio (OpenAI-compatible)
  #   "groq/"    → Groq Cloud
  #   (no prefix)→ OpenRouter / native OpenAI
  judge_model: "gemini/gemini-3.5-flash"

  embedding_model: "openai/text-embedding-3-small"
  openrouter_base_url: "https://openrouter.ai/api/v1"
  max_tokens: 1000

thresholds:
  max_acceptable_delta: 0.05               # 5% maximum calibration delta (MAE)

paths:
  input_data: "data/human_baseline.csv"
  evaluation_output: "data/llm_eval_results.json"

# ==============================================================================
# Phase 3: Online Shadow Evaluation — Production Drift Monitoring
# ==============================================================================
online_evaluation:
  run_simulation: true                    # Set true to simulate shadow evals from CSV
  run_drift_report: true                  # Set true to generate a drift report only

  # Simulation Settings (used when run_simulation: true)
  simulation_data: "data/load_test_150.csv"
  max_simulation_records: 10               # Number of records to evaluate in simulation
  sample_rate: 1.0                         # 1.0 = evaluate all records (testing mode)

  # Database & Reporting
  db_path: "data/shadow_evals.db"          # SQLite database for shadow evaluation results
  report_lookback_days: 7                  # Days to look back for drift report

  # Production Settings (used when integrating ShadowEvaluator into a live app)
  # sample_rate: 0.05                      # 5% of live traffic (production mode)
  drift_alert_threshold: 2.0              # Score ≤ this triggers a DRIFT ALERT